# TEST BRANCH ONLY (claude/fw-offload-android-test, not for merging): build the debug APK on every push to this
# branch and publish it as its own pre-release (tag fw-offload-test, replaced each time), so main's rolling
# "main-latest" release is left alone.
name: android

on:
  push:
    branches: [claude/fw-offload-android-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fw-offload-test-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # devourer only: its own submodules are vendor driver trees the build does not use
      - name: Submodules
        run: |
          git submodule update --init third_party/libusb third_party/wifi-sdr
          git -C third_party/wifi-sdr submodule update --init external/devourer

      - uses: cachix/install-nix-action@v31
      # the Nix store between runs: the mipsel cross binutils are not in cache.nixos.org (built from source)
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      # the toolchain (Android SDK/NDK, JDK, Gradle, CMake, mipsel binutils) comes from shell.nix
      - name: Build
        run: nix-shell --run scripts/build-android.sh

      - name: Publish the test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kepyur-fw-offload-test.apk
          short=$(git rev-parse --short HEAD)
          {
            echo "TEST build, not a release: firmware table offload on by default on Android."
            echo "Debug APK built from \`claude/fw-offload-android-test\` at ${short}:"
            echo
            git log -1 --format='%s'
            echo
            echo "Install: \`adb install -r kepyur-fw-offload-test.apk\` (uninstall first if the signatures differ)."
            echo "The log line \"radio: RTL8822B, USB 3, ... up in N s\" gives each bring-up; devourer says"
            echo "\"PHY tables applied via fw offload\" (or that it failed and re-applied them directly)."
            echo "Off again without reinstalling: \`adb shell am start -n com.kepyur.app/.MainActivity --es env WSDR_FW_TABLE_OFLD=0\`, then replug."
          } > notes.md
          gh release delete fw-offload-test --yes --cleanup-tag || true
          gh release create fw-offload-test kepyur-fw-offload-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "fw offload test (${short})" --notes-file notes.md
